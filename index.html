<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07070b">
<meta name="description" content="FacelessAI — Turn one idea into a publish-ready short with AI.">
<title>FacelessAI — AI Short Video Creator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#060609;
  --bg2:#0a0a10;
  --card:rgba(16,16,25,.72);
  --card2:rgba(22,22,34,.82);
  --line:rgba(255,255,255,.09);
  --text:#f7f7fb;
  --muted:#a5a5b5;
  --cyan:#22d3ee;
  --blue:#5b7cff;
  --purple:#9b5cff;
  --pink:#d946ef;
  --green:#34d399;
  --danger:#fb7185;
  --radius:24px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 5%,rgba(91,124,255,.13),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(217,70,239,.11),transparent 28%),
    radial-gradient(circle at 50% 55%,rgba(34,211,238,.055),transparent 35%),
    var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.17;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:linear-gradient(to bottom,black,transparent 75%);
  z-index:-1;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1240px,calc(100% - 40px));
  margin:auto;
}

/* TOP BAR */

.topbar{
  border-bottom:1px solid var(--line);
  background:rgba(7,7,11,.72);
  backdrop-filter:blur(15px);
}

.topbar-inner{
  min-height:36px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  color:#cfcfe0;
  font-size:12px;
  letter-spacing:.02em;
}

.top-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);
}

/* NAV */

nav{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(6,6,9,.72);
  backdrop-filter:blur(20px);
}

.nav-inner{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:20px;
  font-weight:900;
  letter-spacing:-.04em;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 30px rgba(91,124,255,.28);
  font-size:19px;
}

.nav-links{
  display:flex;
  gap:28px;
  align-items:center;
  color:#a9a9ba;
  font-size:14px;
}

.nav-links a{
  transition:.2s;
}

.nav-links a:hover{
  color:white;
}

.nav-cta{
  border:1px solid rgba(255,255,255,.1);
  padding:11px 17px;
  border-radius:12px;
  background:rgba(255,255,255,.055);
  font-size:13px;
  font-weight:700;
}

/* HERO */

.hero{
  padding:100px 0 75px;
  position:relative;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:70px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  border:1px solid rgba(130,120,255,.24);
  background:rgba(91,124,255,.07);
  color:#bcb9ff;
  padding:8px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  margin-bottom:22px;
}

.eyebrow span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
}

.hero h1{
  font-size:clamp(48px,6vw,78px);
  line-height:.98;
  letter-spacing:-.065em;
  max-width:760px;
  margin-bottom:25px;
}

.gradient-text{
  background:linear-gradient(100deg,#fff 10%,#a9a4ff 45%,#67e8f9 85%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-copy{
  max-width:650px;
  color:#a9a9b8;
  font-size:18px;
  line-height:1.75;
}

.hero-buttons{
  display:flex;
  gap:13px;
  margin-top:32px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:14px;
  padding:15px 21px;
  font-weight:800;
  transition:.2s;
}

.btn-primary{
  color:white;
  background:linear-gradient(100deg,#7257ff,#22bde4);
  box-shadow:0 12px 35px rgba(91,124,255,.2);
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 45px rgba(91,124,255,.3);
}

.btn-secondary{
  color:white;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
}

.btn-secondary:hover{
  background:rgba(255,255,255,.08);
}

.hero-chips{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:27px;
}

.chip{
  border:1px solid var(--line);
  color:#9e9ead;
  background:rgba(255,255,255,.025);
  padding:8px 11px;
  border-radius:999px;
  font-size:11px;
}

/* HERO MOCKUP */

.hero-visual{
  position:relative;
}

.glow{
  position:absolute;
  width:330px;
  height:330px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  filter:blur(100px);
  opacity:.14;
  pointer-events:none;
}

.app-window{
  position:relative;
  border:1px solid rgba(255,255,255,.1);
  border-radius:27px;
  background:linear-gradient(145deg,rgba(25,25,38,.88),rgba(10,10,15,.9));
  box-shadow:0 40px 100px rgba(0,0,0,.45);
  overflow:hidden;
  transform:rotate(1deg);
}

.window-top{
  height:50px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  gap:7px;
}

.window-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#454552;
}

.window-title{
  margin-left:8px;
  font-size:11px;
  color:#858595;
}

.mock-body{
  padding:24px;
}

.mock-label{
  color:#777789;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:800;
}

.mock-title{
  font-size:22px;
  font-weight:800;
  margin:9px 0 18px;
}

.mock-input{
  border:1px solid var(--line);
  background:#0b0b12;
  border-radius:14px;
  padding:15px;
  color:#d7d7e2;
  font-size:12px;
  line-height:1.55;
}

.mock-settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.mock-box{
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  border-radius:12px;
  padding:12px;
}

.mock-box small{
  display:block;
  color:#6f6f80;
  font-size:9px;
  margin-bottom:5px;
}

.mock-box strong{
  font-size:11px;
}

.mock-progress{
  margin-top:15px;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
}

.progress-line{
  height:5px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  width:74%;
  box-shadow:0 0 15px rgba(34,211,238,.35);
}

.progress-text{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  color:#777789;
  font-size:9px;
}

/* STRIP */

.workflow-strip{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.018);
}

.strip-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.strip-item{
  padding:25px 20px;
  border-right:1px solid var(--line);
}

.strip-item:last-child{
  border-right:0;
}

.strip-number{
  color:#77778a;
  font-size:10px;
  letter-spacing:.1em;
  margin-bottom:7px;
}

.strip-item strong{
  font-size:14px;
}

/* SECTION */

section{
  scroll-margin-top:100px;
}

.section{
  padding:105px 0;
}

.section-head{
  max-width:720px;
  margin-bottom:45px;
}

.section-kicker{
  color:#8f86ff;
  font-size:11px;
  letter-spacing:.14em;
  font-weight:900;
  margin-bottom:13px;
}

.section h2{
  font-size:clamp(32px,4vw,52px);
  line-height:1.04;
  letter-spacing:-.05em;
  margin-bottom:16px;
}

.section-head p{
  color:#9191a2;
  line-height:1.7;
  font-size:16px;
}

/* GENERATOR */

.generator-wrap{
  border:1px solid rgba(255,255,255,.1);
  border-radius:30px;
  padding:8px;
  background:linear-gradient(135deg,rgba(120,90,255,.08),rgba(34,211,238,.04),rgba(255,255,255,.025));
  box-shadow:0 35px 100px rgba(0,0,0,.25);
}

.generator{
  border-radius:24px;
  background:rgba(9,9,14,.91);
  padding:34px;
}

.generator-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  margin-bottom:28px;
}

.generator-head h3{
  font-size:25px;
  letter-spacing:-.035em;
}

.generator-head p{
  color:#7f7f91;
  font-size:13px;
  margin-top:6px;
}

.live-badge{
  border:1px solid rgba(52,211,153,.2);
  color:#6ee7b7;
  background:rgba(52,211,153,.06);
  padding:8px 11px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.topic-label{
  display:flex;
  justify-content:space-between;
  color:#c6c6d1;
  font-size:12px;
  font-weight:700;
  margin-bottom:9px;
}

.topic{
  width:100%;
  min-height:120px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  outline:none;
  background:#0c0c13;
  color:white;
  line-height:1.6;
  font-size:14px;
  transition:.2s;
}

.topic:focus{
  border-color:rgba(115,105,255,.6);
  box-shadow:0 0 0 4px rgba(115,105,255,.07);
}

.options{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:13px;
}

.field label{
  display:block;
  color:#777789;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:0 0 7px 2px;
}

.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  outline:none;
  background:#0d0d14;
  color:#e7e7ef;
}

.quick{
  margin-top:19px;
}

.quick-title{
  color:#737384;
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.1em;
  margin-bottom:9px;
}

.quick-list{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.quick-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:#aaaabb;
  padding:8px 11px;
  border-radius:10px;
  font-size:11px;
}

.quick-btn:hover{
  color:white;
  border-color:rgba(120,100,255,.4);
}

.generate-row{
  display:flex;
  gap:12px;
  align-items:center;
  margin-top:24px;
}

.generate-btn{
  flex:1;
  min-height:54px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:900;
  background:linear-gradient(100deg,#7658ff,#20c9e8);
  box-shadow:0 15px 35px rgba(91,124,255,.16);
}

.generate-btn:hover{
  transform:translateY(-1px);
}

.generate-note{
  color:#676777;
  font-size:10px;
}

/* GENERATION STATUS */

.status{
  display:none;
  margin-top:22px;
  border:1px solid var(--line);
  background:#0b0b11;
  border-radius:17px;
  padding:18px;
}

.status.active{
  display:block;
}

.status-top{
  display:flex;
  justify-content:space-between;
  color:#b9b9c7;
  font-size:12px;
  margin-bottom:12px;
}

.status-bar{
  height:6px;
  background:#191923;
  border-radius:10px;
  overflow:hidden;
}

.status-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  transition:width .5s;
}

.status-steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:13px;
}

.status-step{
  color:#555566;
  font-size:10px;
}

.status-step.active{
  color:#d8d8e4;
}

/* RESULT */

.result{
  display:none;
  margin-top:22px;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#0b0b11;
}

.result.active{
  display:block;
}

.result-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
}

.video-side{
  background:#050507;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.video-side video{
  width:min(100%,300px);
  max-height:530px;
  border-radius:15px;
  background:black;
}

.result-info{
  padding:25px;
}

.result-success{
  color:#6ee7b7;
  font-size:10px;
  font-weight:900;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.result-info h3{
  font-size:22px;
  margin:9px 0 8px;
}

.result-info p{
  color:#858596;
  line-height:1.6;
  font-size:12px;
}

.script{
  margin-top:20px;
  border:1px solid var(--line);
  background:#08080d;
  border-radius:14px;
  padding:16px;
}

.script-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.script-head strong{
  font-size:11px;
}

.copy-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:#aaaabb;
  padding:6px 9px;
  border-radius:8px;
  font-size:10px;
}

.script-text{
  color:#9999aa;
  white-space:pre-wrap;
  font-size:11px;
  line-height:1.65;
  max-height:250px;
  overflow:auto;
}

.result-actions{
  display:flex;
  gap:9px;
  margin-top:15px;
}

.result-actions a,
.result-actions button{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:white;
  border-radius:10px;
  padding:10px 13px;
  font-size:11px;
  font-weight:800;
}

/* CARDS */

.card-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.card{
  border:1px solid var(--line);
  border-radius:21px;
  background:rgba(255,255,255,.025);
  padding:24px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(130,120,255,.28);
  background:rgba(255,255,255,.04);
}

.card-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,rgba(121,90,255,.18),rgba(34,211,238,.1));
  margin-bottom:20px;
  font-size:18px;
}

.card h3{
  font-size:16px;
  margin-bottom:9px;
}

.card p{
  color:#808091;
  font-size:12px;
  line-height:1.7;
}

/* AUDIENCE */

.audience-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.audience{
  min-height:220px;
  padding:26px;
  border:1px solid var(--line);
  border-radius:22px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
}

.audience:after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  right:-45px;
  bottom:-55px;
  border-radius:50%;
  background:rgba(91,124,255,.15);
  filter:blur(20px);
}

.audience-tag{
  color:#77778a;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:800;
}

.audience h3{
  font-size:24px;
  margin:14px 0 9px;
}

.audience p{
  color:#858595;
  line-height:1.6;
  font-size:12px;
  max-width:320px;
}

/* STEPS */

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.step{
  padding:28px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(255,255,255,.025);
}

.step-no{
  font-size:11px;
  color:#8e82ff;
  font-weight:900;
  margin-bottom:45px;
}

.step h3{
  font-size:19px;
  margin-bottom:9px;
}

.step p{
  color:#818191;
  line-height:1.7;
  font-size:12px;
}

/* PLATFORMS */

.platform-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.platform{
  padding:28px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#0c0c12;
}

.platform-icon{
  font-size:25px;
  margin-bottom:23px;
}

.platform h3{
  margin-bottom:8px;
}

.platform p{
  color:#858595;
  font-size:12px;
  line-height:1.65;
}

/* PRICING */

.pricing{
  max-width:680px;
  margin:auto;
  border:1px solid rgba(127,105,255,.35);
  border-radius:28px;
  background:
    radial-gradient(circle at 100% 0%,rgba(34,211,238,.08),transparent 40%),
    radial-gradient(circle at 0% 100%,rgba(155,92,255,.09),transparent 40%),
    #0b0b12;
  padding:35px;
  box-shadow:0 30px 90px rgba(0,0,0,.3);
}

.price-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.plan-label{
  color:#a59aff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.price{
  font-size:53px;
  font-weight:900;
  letter-spacing:-.06em;
  margin:9px 0 4px;
}

.price span{
  font-size:13px;
  color:#777788;
  font-weight:500;
  letter-spacing:0;
}

.price-description{
  color:#898999;
  font-size:12px;
  line-height:1.6;
  max-width:420px;
}

.price-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin:27px 0;
}

.price-list div{
  color:#bcbcca;
  font-size:12px;
}

.price-list div:before{
  content:"✓";
  color:#67e8f9;
  margin-right:8px;
}

.price-btn{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:13px;
  color:white;
  font-weight:900;
  background:linear-gradient(100deg,#7658ff,#20c9e8);
}

/* FAQ */

.faq{
  max-width:850px;
  margin:auto;
}

.faq-item{
  border-bottom:1px solid var(--line);
}

.faq-q{
  width:100%;
  border:0;
  background:none;
  color:white;
  padding:21px 0;
  display:flex;
  justify-content:space-between;
  text-align:left;
  font-weight:700;
  font-size:14px;
}

.faq-q span{
  color:#777789;
  transition:.2s;
}

.faq-a{
  display:none;
  color:#858595;
  font-size:12px;
  line-height:1.75;
  padding:0 0 20px;
  max-width:760px;
}

.faq-item.open .faq-a{
  display:block;
}

.faq-item.open .faq-q span{
  transform:rotate(45deg);
}

/* CTA */

.final-cta{
  padding:80px 30px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:30px;
  background:
    radial-gradient(circle at 50% 0%,rgba(91,124,255,.12),transparent 50%),
    rgba(255,255,255,.025);
}

.final-cta h2{
  max-width:700px;
  margin:0 auto 15px;
}

.final-cta p{
  color:#858595;
  max-width:560px;
  margin:0 auto;
  line-height:1.7;
  font-size:13px;
}

.final-cta .btn{
  margin-top:25px;
}

/* FOOTER */

footer{
  border-top:1px solid var(--line);
  margin-top:100px;
}

.footer-grid{
  padding:55px 0;
  display:grid;
  grid-template-columns:1.5fr repeat(3,1fr);
  gap:50px;
}

.footer-brand p{
  color:#777788;
  font-size:12px;
  line-height:1.7;
  max-width:310px;
  margin-top:14px;
}

.footer-col h4{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:#bbbaca;
  margin-bottom:15px;
}

.footer-col a{
  display:block;
  color:#777788;
  font-size:12px;
  margin:10px 0;
}

.footer-col a:hover{
  color:white;
}

.footer-bottom{
  border-top:1px solid var(--line);
  padding:18px 0;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:#5e5e6d;
  font-size:10px;
}

/* TOAST */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:100;
  max-width:390px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#11111a;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  color:#dddde7;
  font-size:12px;
  line-height:1.5;
  transform:translateY(130px);
  opacity:0;
  transition:.3s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.error{
  border-color:rgba(251,113,133,.3);
}
